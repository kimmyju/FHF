# Add gradient-guided marker substitution consistency as an explicit ablation.
extends: ../base.yaml
experiment: hierarchy-hotflip
paths:
  checkpoint_dir: outputs/hotflip
  validation_csv: outputs/hotflip/val.csv
  train_split_csv: outputs/hotflip/train_split.csv
  history_json: outputs/hotflip/history.json
  config_snapshot: outputs/hotflip/config_resolved.yaml
  eval_csv: outputs/hotflip/val.csv
  eval_report: outputs/hotflip/evaluation.json
losses:
  hotflip:
    enabled: true
    weight: 0.05
    max_examples: 2
