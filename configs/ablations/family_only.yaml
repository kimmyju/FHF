# Family-only ablation: measures six-provider classification. Not valid for Kaggle 18-class submission.
extends: ../base.yaml
experiment: family-only
paths:
  checkpoint_dir: outputs/family-only
  validation_csv: outputs/family-only/val.csv
  train_split_csv: outputs/family-only/train_split.csv
  history_json: outputs/family-only/history.json
  config_snapshot: outputs/family-only/config_resolved.yaml
  eval_csv: outputs/family-only/val.csv
  eval_report: outputs/family-only/evaluation.json
model:
  heads:
    family: true
    model: false
    projection: false
losses:
  exact_classification:
    enabled: false
  family:
    enabled: true
    weight: 1.0
  intra_contrastive:
    enabled: false
  rdrop:
    enabled: false
