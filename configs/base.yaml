# Shared experiment configuration. Relative paths are resolved against paths.base_dir.
experiment: fhf-hierarchical
seed: 42

paths:
  base_dir: .
  train_csv: data/train.csv
  checkpoint_dir: outputs/fhf-base
  validation_csv: outputs/fhf-base/val.csv
  train_split_csv: outputs/fhf-base/train_split.csv
  history_json: outputs/fhf-base/history.json
  config_snapshot: outputs/fhf-base/config_resolved.yaml
  eval_csv: outputs/fhf-base/val.csv
  eval_report: outputs/fhf-base/evaluation.json
  test_csv: data/test.csv
  submission_parquet: submission.parquet
  external_csv: data/external.csv
  external_encoder_dir: outputs/fhf-external
  # Needed for adapter-only checkpoints when the frozen base is not bundled.
  # In Kaggle this must point to a preattached, offline base-model directory.
  inference_base_encoder: null

model:
  encoder: answerdotai/ModernBERT-large
  tokenizer: null  # Defaults to model.encoder. Override after external pretraining.
  max_length: 384
  dropout: 0.10
  projection_dim: 128
  pooling: mean  # mean | attention
  style:
    enabled: false
    hash_dim: 256
    hidden_dim: 128
  residual_fusion:
    enabled: false
    flat_weight: 0.5
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [Wqkv, Wo]
    bias: none
    initial_adapter: null
    bundle_base_encoder: false
  heads:
    family: true
    model: true
    projection: true

losses:
  exact_classification:
    enabled: true
    weight: 1.0
  flat_classification:
    enabled: false
    weight: 0.30
  family:
    enabled: true
    weight: 0.25
  intra_contrastive:
    enabled: true
    weight: 0.25
    temperature: 0.12
    hard_weight: 2.0
  rdrop:
    enabled: true
    weight: 0.05
  hotflip:
    enabled: false
    weight: 0.05
    max_examples: 2

training:
  epochs: 5
  # Choose 15 for a new longer run. Keep original baseline defaults unchanged.
  early_stopping:
    enabled: false
    patience: 4
    min_delta: 0.001
  scheduler:
    name: none  # none | cosine
    warmup_ratio: 0.05
    min_lr_ratio: 0.05
  log_epoch_metrics: true
  learning_rate: 0.0001
  weight_decay: 0.01
  gradient_accumulation_steps: 2
  mixed_precision: auto # bf16 on supported CUDA; fp16 fallback; full precision on CPU
  grad_clip: 1.0
  validation_fraction: 0.20
  batch_families: 2
  models_per_family: 2
  samples_per_model: 2
  steps_per_epoch: null
  eval_batch_size: 16
  num_workers: 0

inference:
  batch_size: 16

external_pretraining:
  epochs: 2
  batch_size: 32
  learning_rate: 0.00002
  seed: 42

# Training metrics: offline by default; change to online after wandb login.
# No API keys or passwords belong in this YAML.
wandb:
  enabled: true
  mode: online #offline
  project: fhf-name-that-llm
  entity: null
  run_name: null
  group: null
  tags: [modernbert, lora, attribution]
  dir: outputs/wandb
  log_every_n_steps: 5
  log_confusion_matrix: true
