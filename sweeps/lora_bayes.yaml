# Bayesian optimization of LoRA rank, scaling, LR, dropout and contrastive weight.
# Run: wandb sweep sweeps/lora_bayes.yaml
# Then: wandb agent YOUR_ENTITY/fhf-name-that-llm/SWEEP_ID
program: scripts/sweep_train.py
name: fhf-modernbert-lora-bayes
project: fhf-name-that-llm
method: bayes
metric:
  name: val/best_balanced_accuracy
  goal: maximize
parameters:
  training.learning_rate:
    distribution: log_uniform_values
    min: 0.00002
    max: 0.0003
  model.lora.r:
    values: [8, 16, 32]
  model.lora.alpha:
    values: [16, 32, 64]
  model.lora.dropout:
    values: [0.0, 0.05, 0.1]
  losses.intra_contrastive.weight:
    values: [0.1, 0.25, 0.5]
  losses.family.weight:
    values: [0.1, 0.25, 0.5]
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --config
  - configs/base.yaml
