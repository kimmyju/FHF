# Installable package metadata, including YAML configuration parsing dependencies.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhf-attribution"
version = "0.4.0"
description = "Config-driven fine-grained hierarchical LLM fingerprint attribution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=12", "scikit-learn>=1.3", "torch>=2.2", "transformers>=4.48,<6", "sentencepiece>=0.1.99", "safetensors>=0.4", "PyYAML>=6.0", "peft>=0.14,<1", "wandb>=0.18,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
